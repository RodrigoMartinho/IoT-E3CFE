<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma IoT SmartFarm - Equipamentos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
</head>
<body style="background: transparent; padding: 1.5rem;">

    <div class="content-header">
        <h2>Gestão de Equipamentos</h2>
        <button class="btn-novo" onclick="incluir('Cadastrar Novo Equipamento')">+ Novo Equipamento</button>
    </div>
    <p>Lista dos equipamentos e maquinários monitorados pelos sensores IoT da fazenda</p>
    <br>

    <div id="modal-cadastro" class="modal-overlay" style="display: none;">
        <div class="modal-conteudo">
            <div class="modal-header">
                <h3 id="titulo-modal">Cadastrar Novo Equipamento</h3>
            </div>
            <form id="form-equipamento">
                <div class="form-grupo">
                    <label for="ID">Código</label>
                    <input type="text" id="ID" placeholder="Ex: 01">
                </div>
                <div class="form-grupo">
                    <label for="equipamento">Equipamento</label>
                    <input type="text" id="equipamento">
                </div>
                <div class="form-grupo">
                    <label for="tipo">Tipo</label>
                    <input type="text" id="tipo">
                </div>
                <div class="form-grupo">
                    <label for="manutencao">Última Manutenção</label>
                    <input type="text" id="manutencao">
                </div>
                <div class="form-grupo">
                    <label for="status">Status</label>
                    <input type="text" id="status">
                </div>

                <div class="form-botoes">
                    <button type="button" class="btn-salvar" onclick="salvarEquipamento()">Salvar</button>
                    <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <table class="tabela-dados">
        <thead>
            <tr>
                <th>Código</th>
                <th>Equipamento</th>
                <th>Tipo</th>
                <th>Última Manutenção</th>
                <th>Status</th>
                <th style="width: 100px; text-align: center;">Ações</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        const dadosIniciais = [
            { ID: "01", equipamento: "Trator John Deere 6110M", tipo: "Maquinário", manutencao: "15/08/2026", status: "Operacional" },
            { ID: "02", equipamento: "Pivô Central de Irrigação", tipo: "Sistema de Irrigação", manutencao: "01/09/2026", status: "Em Operação" },
            { ID: "03", equipamento: "Estação Meteorológica IoT", tipo: "Sensor Climatológico", manutencao: "10/07/2026", status: "Manutenção Necessária" }
        ];

        function carregarDados() {
            const tbody = document.querySelector('.tabela-dados tbody');
            tbody.innerHTML = '';

            dadosIniciais.forEach(item => {
                const novaLinha = document.createElement('tr');
                novaLinha.innerHTML = `
                    <td>${item.ID}</td>
                    <td>${item.equipamento}</td>
                    <td>${item.tipo}</td>
                    <td>${item.manutencao}</td>
                    <td>${item.status}</td>
                    <td>
                        <div class="acoes-container">
                            <button type="button" class="btn-icon btn-editar" title="Editar" onclick="alterar(this)">
                                <img src="img/alterar.png" alt="Editar" class="icon-img">
                            </button>
                            <button type="button" class="btn-icon btn-excluir" title="Excluir" onclick="excluir(this, 'Deseja realmente excluir este equipamento?')">
                                <img src="img/excluir.png" alt="Excluir" class="icon-img">
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(novaLinha);
            });
        }

        function alterar(botao) {
            linhaEmEdicao = botao.closest('tr');
            const colunas = linhaEmEdicao.querySelectorAll('td');

            document.getElementById('ID').value = colunas[0].innerText;
            document.getElementById('equipamento').value = colunas[1].innerText;
            document.getElementById('tipo').value = colunas[2].innerText;
            document.getElementById('manutencao').value = colunas[3].innerText;
            document.getElementById('status').value = colunas[4].innerText;

            document.getElementById('titulo-modal').innerText = 'Editar Equipamento';
            abrirModal();
        }

        function salvarEquipamento() {
            const ID = document.getElementById('ID').value;
            const equipamento = document.getElementById('equipamento').value;
            const tipo = document.getElementById('tipo').value;
            const manutencao = document.getElementById('manutencao').value;
            const status = document.getElementById('status').value;

            if (!ID || !equipamento) {
                alert('Por favor, preencha o ID e o Equipamento!');
                return;
            }

            const htmlBotoesAcao = `
                <div class="acoes-container">
                    <button type="button" class="btn-icon btn-editar" title="Editar" onclick="alterar(this)">
                        <img src="img/alterar.png" alt="Editar" class="icon-img">
                    </button>
                    <button type="button" class="btn-icon btn-excluir" title="Excluir" onclick="excluir(this, 'Deseja realmente excluir este equipamento?')">
                        <img src="img/excluir.png" alt="Excluir" class="icon-img">
                    </button>
                </div>
            `;

            const htmlConteudoLinha = `
                <td>${ID}</td>
                <td>${equipamento}</td>
                <td>${tipo || '-'}</td>
                <td>${manutencao || '-'}</td>
                <td>${status || 'Operacional'}</td>
                <td>${htmlBotoesAcao}</td>
            `;

            if (linhaEmEdicao) {
                linhaEmEdicao.innerHTML = htmlConteudoLinha;
                linhaEmEdicao = null;
            } else {
                const tbody = document.querySelector('.tabela-dados tbody');
                const novaLinha = document.createElement('tr');
                novaLinha.innerHTML = htmlConteudoLinha;
                tbody.appendChild(novaLinha);
            }

            document.getElementById('form-equipamento').reset();
            fecharModal();
        }

        window.onload = carregarDados;
    </script>

</body>
</html>
