<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma IoT SmartFarm - Meio Ambiente</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Arquivo de Funções JavaScript Globais -->
    <script src="js/script.js"></script>
</head>
<body style="background: transparent; padding: 1.5rem;">

    <div class="content-header">
        <h2>Monitoramento Ambiental</h2>
        <button class="btn-novo" onclick="incluir('Cadastrar Novo Sensor Ambiental')">+ Novo Sensor</button>
    </div>
    <p>Dados climáticos e condições ambientais coletados em tempo real na fazenda</p>
    <br>

    <div id="modal-cadastro" class="modal-overlay" style="display: none;">
        <div class="modal-conteudo">
            <div class="modal-header">
                <h3 id="titulo-modal">Cadastrar Novo Sensor Ambiental</h3>
            </div>
            <form id="form-ambiente">
                <div class="form-grupo">
                    <label for="ID">ID</label>
                    <input type="text" id="ID" placeholder="Ex: 07">
                </div>
                <div class="form-grupo">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao">
                </div>
                <div class="form-grupo">
                    <label for="leitura">Leitura Atual</label>
                    <input type="text" id="leitura">
                </div>
                <div class="form-grupo">
                    <label for="ideal">Faixa Ideal</label>
                    <input type="text" id="ideal">
                </div>
                <div class="form-grupo">
                    <label for="status">Status</label>
                    <input type="text" id="status">
                </div>

                <div class="form-botoes">
                    <button type="button" class="btn-salvar" onclick="salvar()">Salvar</button>
                    <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <table class="tabela-dados">
        <thead>
            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Leitura Atual</th>
                <th>Faixa Ideal</th>
                <th>Status</th>
                <th style="width: 100px; text-align: center;">Ações</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        const dadosIniciais = [
            { ID: "01", descricao: "Curral", leitura: "24.5 ºC", ideal: "20 - 28 ºC", status: "Ideal" },
            { ID: "02", descricao: "Plantação", leitura: "68%", ideal: "60 - 75%", status: "Ideal" },
            { ID: "03", descricao: "Açude", leitura: "42%", ideal: "50 - 90%", status: "Alerta (Baixo)" }
        ];

        function carregarDados() {
            const tbody = document.querySelector('.tabela-dados tbody');
            tbody.innerHTML = '';

            dadosIniciais.forEach(item => {
                const novaLinha = document.createElement('tr');
                novaLinha.innerHTML = `
                    <td>${item.ID}</td>
                    <td>${item.descricao}</td>
                    <td>${item.leitura}</td>
                    <td>${item.ideal}</td>
                    <td>${item.status}</td>
                    <td>
                        <div class="acoes-container">
                            <button type="button" class="btn-icon btn-editar" title="Editar" onclick="alterar(this)">
                                <img src="img/alterar.png" alt="Editar" class="icon-img">
                            </button>
                            <button type="button" class="btn-icon btn-excluir" title="Excluir" onclick="excluir(this, 'Deseja realmente excluir este sensor?')">
                                <img src="img/excluir.png" alt="Excluir" class="icon-img">
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(novaLinha);
            });
        }

        function alterar(botao) {
            linhaEmEdicao = botao.closest('tr');
            const colunas = linhaEmEdicao.querySelectorAll('td');

            document.getElementById('ID').value = colunas[0].innerText;
            document.getElementById('descricao').value = colunas[1].innerText;
            document.getElementById('leitura').value = colunas[2].innerText;
            document.getElementById('ideal').value = colunas[3].innerText;
            document.getElementById('status').value = colunas[4].innerText;

            document.getElementById('titulo-modal').innerText = 'Editar Sensor Ambiental';
            abrirModal();
        }

        function salvar() {
            const ID = document.getElementById('ID').value;
            const descricao = document.getElementById('descricao').value;
            const leitura = document.getElementById('leitura').value;
            const ideal = document.getElementById('ideal').value;
            const status = document.getElementById('status').value;

            if (!ID || !descricao) {
                alert('Por favor, preencha o ID e a Descrição!');
                return;
            }

            const htmlBotoesAcao = `
                <div class="acoes-container">
                    <button type="button" class="btn-icon btn-editar" title="Editar" onclick="alterar(this)">
                        <img src="img/alterar.png" alt="Editar" class="icon-img">
                    </button>
                    <button type="button" class="btn-icon btn-excluir" title="Excluir" onclick="excluir(this, 'Deseja realmente excluir este sensor?')">
                        <img src="img/excluir.png" alt="Excluir" class="icon-img">
                    </button>
                </div>
            `;

            const htmlConteudoLinha = `
                <td>${ID}</td>
                <td>${descricao}</td>
                <td>${leitura || '-'}</td>
                <td>${ideal || '-'}</td>
                <td>${status || 'Ideal'}</td>
                <td>${htmlBotoesAcao}</td>
            `;

            if (linhaEmEdicao) {
                linhaEmEdicao.innerHTML = htmlConteudoLinha;
                linhaEmEdicao = null;
            } else {
                const tbody = document.querySelector('.tabela-dados tbody');
                const novaLinha = document.createElement('tr');
                novaLinha.innerHTML = htmlConteudoLinha;
                tbody.appendChild(novaLinha);
            }

            document.getElementById('form-ambiente').reset();
            fecharModal();
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
